<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TipSplit</title>
<style>
  /* TipSplit palette (kept) + BarSpec's design language: sidebar shell, eyebrow
     labels, serif headings, mono numerals, top-accent stat cards. */
  :root {
    --bg: #0d1411;
    --side: #0a100d;
    --panel: #131b16;
    --panel2: #18211b;
    --hover: #1d271f;
    --ink: #eaf2ec;
    --muted: #9fb3a6;
    --faint: #7e9285;
    --line: rgba(150, 200, 168, .14);
    --line2: rgba(150, 200, 168, .28);
    --accent: #5bbf7f;
    --accent-hi: #7fd2a2;
    --accent-dim: rgba(91, 191, 127, .13);
    --good: #5bbf7f;
    --warn: #e0b84c;
    --danger: #d96c5f;
    --cream: #f2f7f3;
    --r: 12px;
    /* system stacks in the same ROLES as BarSpec's webfonts — no network fonts,
       so the app still looks right on a venue's offline LAN */
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }   /* width:100% + padding must not overflow (again) */
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    min-height: 100vh;
  }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    background: var(--side); border-right: 1px solid var(--line);
    padding: 16px 12px 22px; display: flex; flex-direction: column; gap: 2px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px 18px; }
  .brand .word { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--cream); }
  .brand .word em { font-style: italic; color: var(--accent); font-weight: 500; }
  .brand .ver { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .grp {
    font-size: 10.5px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
    color: var(--faint); padding: 13px 10px 6px;
  }
  .sidenav { display: flex; flex-direction: column; gap: 2px; }

  .navitem, #weekList .week-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 11px; border-radius: 9px; border: 1px solid transparent;
    background: transparent; color: var(--muted); font-family: var(--sans);
    font-size: 14.5px; font-weight: 600; cursor: pointer; text-align: left;
    min-height: 44px; width: 100%;
  }
  .navitem:hover, #weekList .week-item:hover { background: var(--panel); color: var(--ink); }
  #weekList .week-item.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--cream);
  }
  .week-date { font-weight: 600; }
  .week-pool { color: var(--faint); font-size: 12.5px; font-family: var(--mono); }
  #teamList > div {
    color: var(--muted); font-size: 14px; display: flex; justify-content: space-between;
    gap: 6px; align-items: center; white-space: nowrap; overflow: hidden;
  }
  #teamList > div > span { overflow: hidden; text-overflow: ellipsis; }
  .audit { font-size: 12px; color: var(--faint); font-family: var(--mono); line-height: 1.7;
           overflow-wrap: anywhere; }
  .audit div { padding: 1px 0; }

  /* ---------- main ---------- */
  main { padding: 22px 26px 40px; max-width: 1150px; min-width: 0; }
  .mhead { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .crumb {
    color: var(--faint); font-size: 10.5px; font-family: var(--mono); font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .mhead h1 { font-family: var(--serif); font-size: 27px; font-weight: 600; margin: 2px 0 0; color: var(--cream); }
  .hint { color: var(--faint); font-size: 13px; margin-top: 4px; }
  .empty { color: var(--faint); text-align: center; padding: 44px 0; }

  .panel {
    background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r);
    padding: 16px 18px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: end; }
  .row .grow, .grow { flex: 1; min-width: 0; }

  /* stat cards: top accent line + eyebrow caption + mono number (BarSpec shape) */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
  .stat {
    position: relative; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 13px; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1.5px;
    background: var(--accent); opacity: .55;
  }
  .stat .num {
    font-family: var(--mono); font-size: 23px; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .stat .cap {
    font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--faint);
  }

  /* ---------- controls ---------- */
  button {
    background: var(--accent); color: #08130c; border: 0; border-radius: 9px;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    padding: 9px 15px; min-height: 40px; cursor: pointer;
  }
  button.ghost, button.sm.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line2); }
  button.ghost:hover { color: var(--ink); background: var(--hover); }
  button.sm { font-size: 12.5px; padding: 5px 11px; min-height: 32px; border-radius: 7px; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button:hover { filter: brightness(1.08); }
  a.btn {
    display: inline-block; background: transparent; color: var(--muted);
    border: 1px solid var(--line2); border-radius: 9px; font-size: 12.5px;
    font-weight: 600; padding: 6px 12px; min-height: 32px; text-decoration: none;
  }
  a.btn:hover { color: var(--ink); background: var(--hover); }
  select, input {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line2);
    border-radius: 8px; font-family: var(--sans); font-size: 15px; padding: 8px 10px;
    width: 100%; min-width: 0;
  }
  input[type=number] { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  input::placeholder { color: var(--faint); }
  label {
    display: block; color: var(--faint); font-size: 10.5px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; margin: 8px 0 3px;
  }

  /* ---------- week view ---------- */
  .week-header { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .week-header h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 4px; color: var(--cream); }
  .week-facts { color: var(--faint); font-size: 13px; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--warn); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px;
    vertical-align: middle;
  }
  .statement {
    margin: 12px 0 14px; padding: 9px 13px; border-left: 3px solid var(--accent);
    background: var(--accent-dim); color: var(--muted); font-size: 13.5px; border-radius: 6px;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th {
    text-align: left; color: var(--faint); font-size: 10px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; padding: 6px 8px;
    border-bottom: 1px solid var(--line2);
  }
  th.num, td.num { text-align: right; }
  td {
    padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 15px;
    vertical-align: middle; font-variant-numeric: tabular-nums;
  }
  td input { padding: 5px 7px; font-size: 15px; min-height: 34px; }
  td.staff-name { font-weight: 600; color: var(--cream); }
  .net-share { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .vales-cell { font-family: var(--mono); font-size: 13px; }
  .edit-note { color: var(--faint); font-size: 13px; margin-top: 10px; }

  .check { font-size: 13px; margin-left: 8px; }
  .check.ok { color: var(--good); }
  .check.bad { color: var(--warn); }
  .hidden { display: none !important; }   /* #gate is an id — plain .hidden loses on specificity */

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); color: var(--ink); border: 1px solid var(--accent);
    padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 60;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ---------- PIN gate ---------- */
  #gate {
    position: fixed; inset: 0; background: rgba(6, 11, 8, .97); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  .gate-box {
    background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r);
    padding: 24px; width: min(340px, 90vw);
  }
  .gate-box h2 { font-family: var(--serif); margin: 0 0 6px; font-size: 22px; color: var(--accent-hi); }
  .gate-box p { color: var(--faint); font-size: 13.5px; margin: 0 0 10px; }
  .gate-box input { font-family: var(--mono); font-size: 22px; text-align: center; letter-spacing: 6px; }

  /* ---------- phone ---------- */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side {
      border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 14px 16px;
    }
    main { padding: 16px 14px 32px; }
    .mhead h1 { font-size: 23px; }
    .stat-strip { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
    button, a.btn, select, input { min-height: 44px; }
    button.sm { min-height: 40px; }
    td input { min-height: 44px; }
  }
</style>
</head>
<body>
<div id="gate" class="hidden">
  <div class="gate-box">
    <h2 id="gateTitle">PIN</h2>
    <p id="gateMsg"></p>
    <input id="gatePin" type="password" inputmode="numeric" placeholder="PIN"
           autocomplete="current-password">
    <div class="row" style="margin-top: 10px;">
      <button id="gateBtn">Entrar</button>
      <span class="check" id="gateCheck"></span>
    </div>
  </div>
</div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="word">TipSplit</span><em>gorjetas</em><span class="ver">v0.6</span>
    </div>

    <div class="grp">Semanas</div>
    <button id="newWeekBtn" class="navitem">+ Nova semana</button>
    <div id="weekList" class="sidenav"></div>

    <div class="grp">Equipa</div>
    <div id="teamList" class="sidenav"></div>

    <div class="grp">Adiantamento</div>
    <div class="row">
      <select id="valeStaff" class="grow"></select>
      <input id="valeAmount" type="number" step="0.01" min="0" placeholder="€" style="width:78px">
    </div>
    <div class="row" style="margin-top: 6px;">
      <input id="valeNote" class="grow" placeholder="motivo">
      <button id="addValeBtn" class="sm">Add</button>
    </div>

    <div class="grp">Nova pessoa</div>
    <div class="row">
      <input id="staffName" class="grow" placeholder="Nome">
      <input id="staffPosition" placeholder="função" style="width:96px">
    </div>
    <div class="row" style="margin-top: 6px;">
      <button id="addStaffBtn" class="sm" style="width: 100%;">Adicionar à equipa</button>
    </div>

    <div class="grp">Definições</div>
    <div class="row">
      <input id="venueName" class="grow" placeholder="Nome da casa">
      <button id="saveVenueBtn" class="sm">Guardar</button>
    </div>
    <div class="row" style="margin-top: 6px;">
      <input id="newPin" type="password" inputmode="numeric" class="grow" placeholder="Novo PIN">
      <input id="curPin" type="password" inputmode="numeric" placeholder="atual" style="width:78px">
    </div>
    <div class="row" style="margin-top: 6px;">
      <button id="savePinBtn" class="sm">Alterar PIN</button>
      <button id="logoutBtn" class="sm ghost">Sair</button>
    </div>

    <div class="grp">Alterações recentes</div>
    <div id="auditList" class="audit">—</div>
  </aside>

  <main>
    <div class="mhead">
      <div>
        <div class="crumb">KAIDO · TipSplit</div>
        <h1>Gorjetas</h1>
      </div>
      <a class="btn" id="annualBtn" href="#" style="margin-left: auto;">Anual (Excel)</a>
    </div>

    <div class="stat-strip" id="dash"></div>
    <div id="dashNote" class="hint"></div>

    <div class="panel" id="detailPanel" style="margin-top: 16px;">
      <div id="empty" class="empty">Escolhe uma semana à esquerda, ou cria uma nova.</div>
      <div id="detail" class="hidden"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let currentWeek = null;
let staffCache = [];

async function api(url, method = "GET", body = null) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) {
    const err = new Error((await r.text()) || String(r.status));
    err.status = r.status;                 // callers branch on this (401 = gate)
    throw err;
  }
  return r.status === 204 ? null : r.json();
}

// ---------- PIN gate ----------
let gateMode = "login";

function showGate(mode, msg) {
  gateMode = mode;
  $("#gate").classList.remove("hidden");
  $("#gateTitle").textContent = mode === "setup" ? "Define um PIN" : "PIN da casa";
  $("#gateMsg").textContent = msg || (mode === "setup"
    ? "4+ dígitos. É isto que impede alguém de ver as gorjetas de todos."
    : "Introduz o PIN para ver os dados da casa.");
  $("#gatePin").value = "";
  setTimeout(() => $("#gatePin").focus(), 50);
}

async function submitGate() {
  try {
    await api(gateMode === "setup" ? "/api/auth/setup" : "/api/auth/login",
              "POST", { pin: $("#gatePin").value.trim() });
    $("#gateCheck").textContent = "";
    $("#gate").classList.add("hidden");
    boot();
  } catch (e) {
    $("#gateCheck").textContent = e.status === 429
      ? "Demasiadas tentativas — espera 5 minutos." : "PIN errado.";
    $("#gateCheck").className = "check bad";
  }
}

async function boot() {
  const st = await api("/api/auth/status");            // public
  if (!st.pin_set) return showGate("setup");           // first run: protect the till
  try {
    await api("/api/dashboard");                       // probe: gated?
  } catch (e) {
    if (e.status === 401) return showGate("login");
    throw e;
  }
  $("#gate").classList.add("hidden");
  loadWeeks(false);
}

async function loadSettings() {
  const s = await api("/api/settings");
  $("#venueName").value = s.venue_name || "";
  const rows = await api("/api/audit?limit=8");
  $("#auditList").innerHTML = rows.length
    ? rows.map(r => `<div>${esc(r.ts.slice(5, 16))} · ${esc(r.action)} ${esc(r.detail)}</div>`).join("")
    : "—";
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
const eur = (v) => (Math.round(v * 100) / 100).toFixed(2).replace(".", ",") + " €";
function esc(x) {
  return String(x).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function nextMonday() {
  const d = new Date();
  const day = (d.getDay() + 6) % 7;          // days since Monday
  d.setDate(d.getDate() - day + 7);          // NEXT week — this week is usually taken
  return d.toISOString().slice(0, 10);
}

// ---------- split rendering (math lives server-side — no second formula) ----------
// splitting.py owns the money math and the rounding rule. The browser posts the
// working grid to /preview and renders what comes back, so Python and JS can
// never drift apart.
let previewSeq = 0;
let previewTimer = null;

async function previewShares(w) {
  const pool = parseFloat($("#poolInput").value) || 0;
  const entries = w.entries
    .filter(e => e.staff_id)
    .map(e => ({
      staff_id: e.staff_id,
      mon: e.mon || 0, tue: e.tue || 0, wed: e.wed || 0, thu: e.thu || 0,
      fri: e.fri || 0, sat: e.sat || 0, sun: e.sun || 0,
      vales: parseFloat(e.vales) || 0,
    }));
  const seq = ++previewSeq;
  const data = await api("/api/weeks/" + w.id + "/preview", "POST",
                         { pool_eur: pool, entries });
  if (seq !== previewSeq) return null;      // a newer edit already answered
  return data;
}

function applySplit(w, p) {
  const pool = parseFloat($("#poolInput").value) || 0;
  const rows = $("#gridBody").children;
  w.entries.forEach((e, idx) => {
    if (!rows[idx]) return;
    const cell = rows[idx].querySelector("[data-net]");
    if (!cell) return;
    const net = e.staff_id ? p.shares[e.staff_id] : undefined;
    cell.textContent = net === undefined ? "—" : eur(net);
  });
  $("#statHours").textContent = p.total_hours;
  const totalGross = Object.values(p.gross_shares).reduce((a, b) => a + b, 0);
  const totalNet = Object.values(p.shares).reduce((a, b) => a + b, 0);
  $("#statSum").textContent = eur(totalNet);
  $("#statement").textContent = p.statement;

  const check = $("#checkMsg"), statCheck = $("#statCheck");
  const diff = Math.round((totalGross - pool) * 100) / 100;
  if (Math.abs(diff) < 0.01) {
    check.textContent = "✓ pool todo dividido"; check.className = "check ok";
    statCheck.textContent = "✓ OK"; statCheck.style.color = "var(--good)";
  } else {
    check.textContent = "⚠ " + (diff < 0 ? eur(-diff) + " por atribuir"
                                          : eur(diff) + " acima do pool");
    check.className = "check bad";
    statCheck.textContent = "⚠"; statCheck.style.color = "var(--warn)";
  }
  if (p.vale_shortfall > 0.004) {
    check.textContent += ` · ⚠ ${eur(p.vale_shortfall)} vale acima do ganho (dívida ao pote)`;
    check.className = "check bad";
  }
}

function scheduleSplit(w) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const p = await previewShares(w);
    if (p) applySplit(w, p);
  }, 150);
}

// ---------- render: weeks ----------
async function loadWeeks(keepOpen) {
  const weeks = await api("/api/weeks");
  await refreshSidebar();
  const box = $("#weekList");
  box.innerHTML = "";
  if (!weeks.length) { box.innerHTML = '<div class="edit-note">No weeks yet.</div>'; return; }
  for (const w of weeks) {
    const el = document.createElement("div");
    el.className = "week-item" + (w.id === currentWeek ? " active" : "");
    el.innerHTML = `<div>
        <div class="week-date">${fmtDate(w.start_date)}</div>
        <div class="week-pool">pool ${eur(w.pool_eur)}</div>
      </div>
      <button class="ghost small" data-del="${w.id}">✕</button>`;
    el.addEventListener("click", () => openWeek(w.id));
    el.querySelector("[data-del]").addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this week?")) return;
      await api("/api/weeks/" + w.id, "DELETE");
      if (currentWeek === w.id) { currentWeek = null; }
      loadWeeks(); renderEmpty();
    });
    box.appendChild(el);
  }
  if (keepOpen && currentWeek) openWeek(currentWeek);
}

// ---------- render: dashboard + team ----------
function stat(cap, val, small) {
  return `<div class="stat"><div class="cap">${esc(cap)}</div>` +
         `<div class="num"${small ? ' style="font-size:16px"' : ""}>${esc(val)}</div></div>`;
}

async function loadDash() {
  const d = await api("/api/dashboard");
  const w = d.week;
  const cells = [];
  if (w) {
    cells.push(stat("Semana atual", fmtDate(w.start_date), true));
    cells.push(stat("Pool", eur(w.pool_eur)));
    cells.push(stat("Horas", String(w.total_hours)));
    cells.push(stat("A pagar", eur(w.net_total)));
    cells.push(stat("Adiantamentos", eur(w.vales_total)));
  } else {
    cells.push(stat("Semana atual", "—", true));
  }
  if (d.last_closed) cells.push(stat("Última fechada", eur(d.last_closed.net_total)));
  $("#dash").innerHTML = cells.join("");
  const n = d.vale_warnings.length;
  $("#dashNote").textContent = n
    ? `⚠ ${n} adiantamento(s) acima do ganho da semana — dívida ao pote.`
    : `${d.staff_active} pessoa(s) ativas${w ? "" : " · cria a primeira semana"}`;
}

async function refreshSidebar() {
  const t = await api("/api/team");
  staffCache = t.staff;
  const box = $("#teamList");
  box.innerHTML = t.staff.length ? t.staff.map(s => `
    <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; padding:3px 0;${s.archived ? "opacity:.45;" : ""}">
      <span style="min-width:0">${esc(s.name)}${s.position ? ` <span style="color:var(--muted);font-size:13px">${esc(s.position)}</span>` : ""}</span>
      <span style="white-space:nowrap;">
        ${s.vales_week ? `<span style="color:var(--warn);font-size:14px;">${eur(s.vales_week)}</span>` : ""}
        <button class="ghost small" data-arch="${s.id}" data-on="${s.archived ? 0 : 1}"
          title="${s.archived ? "reativar" : "arquivar"}">${s.archived ? "↺" : "⊘"}</button>
      </span>
    </div>`).join("") : '<span style="color:var(--muted)">ninguém ainda</span>';
  box.querySelectorAll("[data-arch]").forEach(b => b.addEventListener("click", async () => {
    await api(`/api/staff/${b.dataset.arch}/archive?archived=${b.dataset.on}`, "POST");
    refreshSidebar();
  }));
  $("#valeStaff").innerHTML = t.staff.filter(s => !s.archived)
    .map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")
    || '<option value="">—</option>';
  loadDash();
  loadSettings();
}

// ---------- render: week detail ----------
const DAY_LABELS = [
  ["mon", "Mon"], ["tue", "Tue"], ["wed", "Wed"], ["thu", "Thu"],
  ["fri", "Fri"], ["sat", "Sat"], ["sun", "Sun"],
];

function weekHours(e) {
  return DAY_LABELS.reduce((a, [k]) => a + (parseFloat(e[k]) || 0), 0);
}

async function openWeek(id) {
  currentWeek = id;
  const w = await api("/api/weeks/" + id);
  // a fresh week has no entry rows yet — open it with the roster, zeroed, so the
  // weekly ritual is "type the hours", not "add eleven people first"
  if (!w.entries.length && staffCache.length) {
    w.entries = staffCache.filter(s => !s.archived).map(s => ({
      staff_id: s.id, name: s.name, position: s.position, archived: s.archived,
      mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0, hours: 0, vales: 0,
    }));
  }
  const d = $("#detail");
  d.classList.remove("hidden");
  $("#empty").classList.add("hidden");

  const locked = w.status === "locked";
  d.innerHTML = `
    <div class="week-header">
      <div>
        <h2>Semana de ${fmtDate(w.start_date)}${locked ? ' <span class="badge">🔒 fechada</span>' : ""}</h2>
        <div class="week-facts">${w.entries.length} pessoas · ${w.total_hours} h no total</div>
      </div>
      <div class="row">
        ${locked ? "" : '<button class="ghost" id="addRowBtn">+ Adicionar pessoa</button>'}
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="cap">Pool (total €)</div>
        <input type="number" id="poolInput" min="0" step="0.01" value="${w.pool_eur}"${locked ? " disabled" : ""}></div>
      <div class="stat"><div class="cap">Total de horas</div><div class="num" id="statHours">${w.total_hours}</div></div>
      <div class="stat"><div class="cap">Total líquido</div><div class="num" id="statSum">—</div></div>
      <div class="stat"><div class="cap">Conferência</div><div class="num" id="statCheck" style="font-size:16px;">—</div></div>
    </div>

    <div class="statement" id="statement">${esc(w.statement || "")}</div>

    <div style="overflow-x: auto;">
    <table>
      <thead><tr>
        <th>Pessoa</th>
        ${DAY_LABELS.map(([, lbl]) => `<th class="num">${lbl}</th>`).join("")}
        <th class="num">Horas</th><th class="num">Vales €</th>
        <th class="num">Líquido €</th>
      </tr></thead>
      <tbody id="gridBody"></tbody>
    </table>
    </div>

    <div class="row" style="margin-top: 16px;">
      ${locked ? "" : '<button id="saveBtn">Guardar semana</button>'}
      ${locked ? "" : '<button class="ghost" id="lockBtn">🔒 Fechar semana</button>'}
      ${locked ? '<button class="ghost" id="unlockBtn">🔓 Desbloquear (com motivo)</button>' : ""}
      <span class="check" id="checkMsg"></span>
    </div>
    <div class="row" style="margin-top: 10px;">
      ${locked ? `<a class="btn" href="/print/payslips/${w.id}" target="_blank" rel="noopener">Payslips</a>
        <a class="btn" href="/print/cashsheet/${w.id}" target="_blank" rel="noopener">Cash sheet</a>` : ""}
      <a class="btn" href="/api/export/week/${w.id}?fmt=xlsx">Excel</a>
      <a class="btn" href="/api/export/week/${w.id}?fmt=csv">CSV</a>
    </div>
    <div class="edit-note" style="color: var(--muted); font-size: 14px; margin-top: 8px;">
      As horas de cada dia (seg–dom) somam o total da pessoa.
      quinhão = pool × horas ÷ total de horas − vales. O líquido nunca é negativo.
      ${locked ? "Semana fechada — para corrigir, é preciso desbloquear (com motivo)." : ""}
    </div>`;

  renderGrid(w);
  if (!locked) {
    $("#poolInput").addEventListener("input", () => scheduleSplit(w));
    $("#addRowBtn").addEventListener("click", () => addRow(w));
    $("#saveBtn").addEventListener("click", () => saveWeek(w));
    $("#lockBtn").addEventListener("click", () => lockWeek(w));
  } else {
    $("#unlockBtn").addEventListener("click", async () => {
      const reason = prompt("Motivo do desbloqueio (fica registado):");
      if (!reason || !reason.trim()) return;
      await api(`/api/weeks/${w.id}/unlock`, "POST", { reason: reason.trim() });
      toast("Semana reaberta — o motivo ficou registado");
      openWeek(w.id);
      loadSettings();
    });
  }
  loadWeeks(false);
}

async function lockWeek(w) {
  if (!confirm("Fechar a semana? Os valores ficam bloqueados para edição.")) return;
  await api(`/api/weeks/${w.id}/lock`, "POST");
  toast("Semana fechada");
  openWeek(w.id);
}

function renderGrid(w) {
  const locked = w.status === "locked";
  w.entries.forEach(e => { e.hours = Math.round(weekHours(e) * 10) / 10; });
  const body = $("#gridBody");
  body.innerHTML = "";

  w.entries.forEach((e, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="staff-name">${esc(e.name)}</td>
      ${DAY_LABELS.map(([k]) => `
        <td class="num"><input type="number" data-i="${idx}" data-k="${k}"
          value="${e[k] || 0}" min="0" step="0.5" style="width:64px"${locked ? " disabled" : ""}></td>`).join("")}
      <td class="num" data-hours>${e.hours || 0}</td>
      <td class="num vales-cell" data-vales${e.vales ? ' style="color:var(--warn)"' : ""}
        title="adiantamentos geridos na Equipa">${e.vales ? eur(e.vales) : "—"}</td>
      <td class="num net-share" data-net>—</td>`;
    tr.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", () => {
        const i = parseInt(inp.dataset.i);
        w.entries[i][inp.dataset.k] = parseFloat(inp.value) || 0;
        w.entries[i].hours = Math.round(weekHours(w.entries[i]) * 10) / 10;
        tr.querySelector("[data-hours]").textContent = w.entries[i].hours || 0;
        scheduleSplit(w);
      });
    });
    body.appendChild(tr);
  });

  scheduleSplit(w);          // fill the net column from the server
}

function addRow(w) {
  const have = new Set(w.entries.map(e => e.staff_id));
  const missing = staffCache.filter(s => !have.has(s.id));
  if (missing.length) {
    for (const s of missing) w.entries.push({
      staff_id: s.id, name: s.name, mon: 0, tue: 0, wed: 0, thu: 0,
      fri: 0, sat: 0, sun: 0, vales: 0, hours: 0,
    });
  } else {
    w.entries.push({
      staff_id: null, name: "New staff", mon: 0, tue: 0, wed: 0, thu: 0,
      fri: 0, sat: 0, sun: 0, vales: 0, hours: 0,
    });
  }
  renderGrid(w);
}

async function saveWeek(w) {
  const pool = parseFloat($("#poolInput").value) || 0;
  const payload = {
    pool_eur: pool,
    entries: w.entries
      .filter(e => e.staff_id)                       // only real staff rows
      .map(e => ({
        staff_id: e.staff_id,
        mon: e.mon, tue: e.tue, wed: e.wed, thu: e.thu,
        fri: e.fri, sat: e.sat, sun: e.sun,
      })),
  };
  try {
    await api(`/api/weeks/${w.id}/save`, "PUT", payload);
    toast("Week saved");
    openWeek(w.id);                                   // reload fresh from server
  } catch (err) {
    toast("Save failed: " + err.message);
  }
}

function renderEmpty() {
  if (!currentWeek) { $("#detail").classList.add("hidden"); $("#empty").classList.remove("hidden"); }
}

// ---------- events ----------
$("#newWeekBtn").addEventListener("click", async () => {
  const created = await api("/api/weeks", "POST", { start_date: nextMonday() });
  if (!created) { toast("That week already exists"); loadWeeks(); return; }
  openWeek(created.id);
  toast("New week created");
});

$("#addStaffBtn").addEventListener("click", async () => {
  const name = $("#staffName").value.trim();
  if (!name) return;
  const s = await api("/api/staff", "POST",
                      { name, position: $("#staffPosition").value.trim() });
  if (!s) { toast("Nome já existe"); return; }
  $("#staffName").value = ""; $("#staffPosition").value = "";
  toast("Adicionado " + s.name);
  await refreshSidebar();
  if (currentWeek) openWeek(currentWeek);
});

$("#addValeBtn").addEventListener("click", async () => {
  const staff_id = parseInt($("#valeStaff").value);
  const amount = parseFloat($("#valeAmount").value);
  if (!staff_id || !(amount > 0)) { toast("Escolhe pessoa e valor"); return; }
  const row = await api("/api/vales", "POST",
                        { staff_id, amount, note: $("#valeNote").value.trim() });
  $("#valeAmount").value = ""; $("#valeNote").value = "";
  toast(`Vale ${eur(row.amount)} → ${row.name}`);
  await refreshSidebar();
  if (currentWeek) openWeek(currentWeek);        // the week's nets changed
});

$("#gateBtn").addEventListener("click", submitGate);
$("#gatePin").addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });

$("#saveVenueBtn").addEventListener("click", async () => {
  await api("/api/settings", "PUT", { venue_name: $("#venueName").value.trim() });
  toast("Nome da casa guardado");
  loadSettings();
});

$("#savePinBtn").addEventListener("click", async () => {
  const pin = $("#newPin").value.trim(), current = $("#curPin").value.trim();
  if (pin.length < 4) { toast("PIN: mínimo 4 dígitos"); return; }
  try {
    await api(`/api/auth/pin?current=${encodeURIComponent(current)}`, "POST", { pin });
    $("#newPin").value = ""; $("#curPin").value = "";
    toast("PIN alterado");
    loadSettings();
  } catch (e) {
    toast("PIN atual errado");
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  await api("/api/auth/logout", "POST");
  location.reload();
});

window.addEventListener("load", () => {
  $("#annualBtn").href = `/api/export/annual/${new Date().getFullYear()}?fmt=xlsx`;
  boot();
});
</script>
</body>
</html>
